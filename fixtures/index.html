<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;background:#0b0c10;color:#eee;font:14px Vazirmatn,sans-serif}
.card{margin:12px;padding:12px;border:1px solid #444;border-radius:16px;background:#15171c}
.icon{stroke:#f0a;stroke-width:3;fill:none}
.av{width:60px;height:60px;border-radius:50%;object-fit:cover;object-position:20% 50%}
.bg{height:90px;background:linear-gradient(90deg,rgba(255,0,0,.4),rgba(0,0,255,.4)),url(/photo.webp) center/cover no-repeat,#222;border-radius:12px}
.inset{height:40px;border-radius:10px;background:#222;box-shadow:inset 0 2px 6px rgba(255,255,255,.4),0 4px 12px rgba(0,0,0,.6),0 0 0 2px rgba(120,80,255,.7)}
.rot{width:80px;height:30px;background:#e94;transform:rotate(-12deg);margin:20px;color:#000;display:flex;align-items:center;justify-content:center}
.flip{display:inline-block;transform:scaleX(-1)}
.fixedbar{position:fixed;left:0;right:0;bottom:0;height:50px;background:#306;display:flex;align-items:center;justify-content:center;z-index:5}
.scroller{height:120px;overflow-y:auto;border:1px solid #555}
.scroller div{height:40px;border-bottom:1px solid #333}
.ts{text-shadow:0 2px 4px rgba(255,0,0,.8);font-size:22px}
.mm{mix-blend-mode:multiply;background:#fa0;height:30px;width:60px}
#modal[hidden]{display:none}#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;z-index:20}
#sheet{background:#1d2027;width:100%;padding:16px;border-radius:20px 20px 0 0;height:180px}
</style>
<div class="card">
  <p>متن <b style="color:#6cf;font-size:18px">پررنگ آبی</b> و <span style="color:#fc6">زرد</span> ادامه<br>خط دوم <u>زیرخط</u></p>
  <p class="ts">سایه متن</p>
</div>
<div class="card">
  <img src="/photo.webp" width="150" height="80" style="object-fit:cover;border-radius:8px">
  <img src="/photo.jpg" width="100" height="100" style="object-fit:contain;background:#333">
  <img class="av" src="/photo.png">
  <img id="xo" src="http://localhost:3998/photo.png" width="120" height="60" style="object-fit:cover">
  <img src="/big.png" width="150" height="100" style="object-fit:cover">
  <img src="/missing.png" width="40" height="40" alt="x">
</div>
<div class="card"><div class="bg"></div><div class="inset" style="margin-top:12px"></div></div>
<div class="card">
  <svg width="0" height="0" style="position:absolute"><defs><symbol id="sym" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" fill="none"/><path d="M8 12l3 3 5-6" stroke="currentColor" stroke-width="2" fill="none"/></symbol><linearGradient id="gr"><stop offset="0" stop-color="#f00"/><stop offset="1" stop-color="#00f"/></linearGradient></defs></svg>
  <svg class="icon" width="32" height="32" viewBox="0 0 24 24"><path d="M4 12h16M12 4v16"/></svg>
  <svg width="32" height="32" style="color:#6c6"><use href="#sym"/></svg>
  <svg width="32" height="32" viewBox="0 0 24 24" fill="url(#gr)"><rect x="3" y="3" width="18" height="18" rx="4"/></svg>
  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:#fc0;transform:rotate(180deg)"><path d="M5 9l7 7 7-7"/></svg>
  <span class="flip"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#6cf" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
</div>
<div class="card"><div class="rot">rotated</div><div class="mm"></div><div class="scroller"><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div><div>7</div><div>8</div></div></div>
<div style="height:300px;margin:12px;background:repeating-linear-gradient(#222,#222 20px,#2a2a2a 20px,#2a2a2a 40px)">tall</div>
<div class="fixedbar">fixed bar</div>
<div id="modal" hidden><div id="sheet">bottom sheet content</div></div>
<script>document.getElementById('modal').hidden = new URLSearchParams(location.search).get('modal') !== '1';</script>
</html>
