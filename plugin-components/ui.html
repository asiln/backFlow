<!doctype html>
<meta charset="utf-8">
<style>
  body{font:12px Inter,system-ui,sans-serif;margin:12px;color:#222}
  textarea{width:100%;height:90px;box-sizing:border-box;font:11px monospace}
  button{margin-top:8px;padding:8px 12px;border:0;border-radius:6px;background:#5b38d6;color:#fff;font-weight:600;cursor:pointer}
  button.sec{background:#ddd;color:#222}
  button:disabled{opacity:.5;cursor:default}
  #log{margin-top:8px;white-space:pre-wrap;font-size:11px;max-height:300px;overflow:auto;background:#f6f6f6;padding:6px;border-radius:4px}
  label{display:block;margin:6px 0 2px;font-weight:600}
  label.chk,label.rad{font-weight:400;display:flex;gap:6px;align-items:center;margin:3px 0}
  progress{width:100%;height:10px;margin-top:8px}
  #prog{font-size:11px;color:#666}
</style>
<label>Paste _library.json</label>
<textarea id="t" placeholder='{"version":1,"components":[...],"icons":[...]}'></textarea>
<label>or choose the file</label>
<input type="file" id="f" accept=".json,application/json">
<label>Mode</label>
<label class="rad"><input type="radio" name="m" value="dry" checked> Dry run (report only, creates nothing)</label>
<label class="rad"><input type="radio" name="m" value="apply"> Apply (create missing, idempotent)</label>
<label class="rad"><input type="radio" name="m" value="review"> Review report (review-band components)</label>
<label class="chk"><input type="checkbox" id="sup" checked> Changed library entry: build new, rename old "(superseded)"</label>
<label class="chk"><input type="checkbox" id="vl" checked> Verify auto-layout of masters (disable only for debugging)</label>
<button id="go">Run</button> <button id="cancel" class="sec" disabled>Cancel</button> <button id="copy" class="sec" disabled>Copy report</button>
<progress id="bar" value="0" max="1" hidden></progress>
<div id="prog"></div>
<div id="log"></div>
<script>
const $ = id => document.getElementById(id), log = m => { const l = $('log'); l.textContent += m + '\n'; l.scrollTop = l.scrollHeight; };
let lastReport = '';
$('f').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  $('t').value = await f.text(); log('Loaded ' + f.name + ' (' + Math.round(f.size / 1024) + ' KB)');
};
$('go').onclick = () => {
  const text = $('t').value.trim(); if (!text) { log('Paste or choose _library.json first.'); return; }
  const mode = document.querySelector('input[name=m]:checked').value;
  $('log').textContent = ''; $('go').disabled = true; $('cancel').disabled = false; $('copy').disabled = true; $('bar').hidden = false;
  parent.postMessage({ pluginMessage: { type: 'run', mode, library: text, opts: { supersede: $('sup').checked, verifyLayout: $('vl').checked } } }, '*');
};
$('cancel').onclick = () => parent.postMessage({ pluginMessage: { type: 'cancel' } }, '*');
$('copy').onclick = () => {
  const ta = document.createElement('textarea'); ta.value = lastReport; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); log('Report copied.'); } catch (e) { log('Copy failed, select the log text manually.'); }
  ta.remove();
};
onmessage = e => {
  const m = e.data.pluginMessage; if (!m) return;
  if (m.log) log(m.log);
  if (m.progress) { $('bar').max = m.progress.total || 1; $('bar').value = m.progress.done; $('prog').textContent = m.progress.done + ' / ' + m.progress.total + '  ' + (m.progress.item || ''); }
  if (m.report) lastReport = m.report;
  if (m.finished) { $('go').disabled = false; $('cancel').disabled = true; $('copy').disabled = !lastReport; }
};
</script>
