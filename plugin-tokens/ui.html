<!doctype html>
<meta charset="utf-8">
<style>
  body{font:12px Inter,system-ui,sans-serif;margin:12px;color:#222}
  textarea{width:100%;height:90px;box-sizing:border-box;font:11px monospace}
  button{margin:8px 6px 0 0;padding:8px 12px;border:0;border-radius:6px;background:#5b38d6;color:#fff;font-weight:600;cursor:pointer}
  button.sec{background:#ddd;color:#222}
  button.warn{background:#c2410c}
  button:disabled{opacity:.5;cursor:default}
  label{display:block;margin:6px 0 2px;font-weight:600}
  label.chk{font-weight:400;display:flex;gap:6px;align-items:center}
  progress{width:100%;height:10px;margin-top:8px}
  #prog{font-size:11px;color:#666}
  #info{font-size:11px;color:#555;margin-top:2px}
  #sum{margin-top:8px;font-size:12px}
  #sum table{border-collapse:collapse}
  #sum td,#sum th{padding:2px 8px;border-bottom:1px solid #eee;text-align:left}
  #log{margin-top:8px;white-space:pre-wrap;font-size:11px;max-height:130px;overflow:auto;background:#f6f6f6;padding:6px;border-radius:4px}
  #list{margin-top:8px;max-height:200px;overflow:auto;border:1px solid #ddd;border-radius:6px;font-size:11px}
  .row{display:flex;gap:8px;padding:2px 8px;border-bottom:1px solid #eee}
  .row .s{width:84px;font-weight:600}
  .row .n{flex:1;word-break:break-all}
  .s-conflict,.s-failed{color:#c62828}.s-review{color:#b36b00}.s-exists{color:#1a7f37}.s-skipped{color:#999}
  .hint{font-size:11px;color:#666}
</style>
<label>Paste tokens.json</label>
<textarea id="t" placeholder="{&quot;version&quot;:1,&quot;colors&quot;:[...]}"></textarea>
<label>or choose the tokens.json file</label>
<input type="file" id="f" accept=".json,application/json">
<div id="info"></div>
<label class="chk"><input type="checkbox" id="rev"> Also create tokens with status "review" (default: report only)</label>
<label class="chk"><input type="checkbox" id="adopt"> Stamp ownership on matching existing items (writes plugin data only)</label>
<div>
  <button id="dry">Dry run</button><button id="apply" class="warn">Apply</button><button id="inv" class="sec">Export inventory</button><button id="cancel" class="sec" disabled>Cancel</button>
</div>
<div class="hint">Dry run changes nothing. Apply creates only what is missing and never edits designer-made variables or styles. Export inventory needs no tokens.json.</div>
<progress id="bar" value="0" max="1" hidden></progress>
<div id="prog"></div>
<div id="sum"></div>
<div id="list"></div>
<div>
  <button id="dl" class="sec" disabled>Download result JSON</button><button id="cp" class="sec" disabled>Copy result JSON</button>
</div>
<div id="log"></div>
<script>
var $ = function (id) { return document.getElementById(id); };
var tokens = null, lastJson = '', lastName = 'result.json', armed = null, armTimer = null;
function log(m) { var l = $('log'); l.textContent += m + '\n'; l.scrollTop = l.scrollHeight; }
function parseTokens() {
  var txt = $('t').value.trim();
  if (!txt) return null;
  var d;
  try { d = JSON.parse(txt); } catch (e) { log('Invalid JSON: ' + e.message); return null; }
  if (!d || d.version !== 1 || !Array.isArray(d.colors)) { log('Not a tokens.json (needs version 1 and a "colors" array).'); return null; }
  return d;
}
function info(d) {
  $('info').textContent = d ? 'tokens.json: ' + d.colors.length + ' colours, ' + (d.textStyles || []).length + ' text, ' + (d.radii || []).length + ' radii, ' + (d.spacing || []).length + ' spacing, ' + (d.effects || []).length + ' effects, ' + (d.sizes || []).length + ' sizes' : '';
}
$('f').onchange = function (e) {
  var f = e.target.files[0]; if (!f) return;
  f.text().then(function (s) { $('t').value = s; log('Loaded ' + f.name + ' (' + Math.round(f.size / 1024) + ' KB)'); info(parseTokens()); });
};
$('t').oninput = function () { info(parseTokens()); };
function busy(on) {
  ['dry', 'apply', 'inv'].forEach(function (id) { $(id).disabled = on; });
  $('cancel').disabled = !on; $('bar').hidden = !on && true;
  if (on) $('bar').hidden = false;
}
function send(action) {
  var d = null;
  if (action !== 'inventory') { d = parseTokens(); if (!d) { log('Load a valid tokens.json first.'); return; } tokens = d; }
  $('log').textContent = ''; $('sum').textContent = ''; $('list').textContent = ''; lastJson = ''; $('dl').disabled = true; $('cp').disabled = true;
  busy(true);
  parent.postMessage({ pluginMessage: { type: 'run', action: action, tokens: d, opts: { createReview: $('rev').checked, adopt: $('adopt').checked } } }, '*');
}
$('dry').onclick = function () { send('dry'); };
$('inv').onclick = function () { send('inventory'); };
$('apply').onclick = function () { // two-click confirm: browser dialogs are unreliable in the plugin sandbox
  if (armed) { clearTimeout(armTimer); armed = null; $('apply').textContent = 'Apply'; send('apply'); return; }
  armed = true; $('apply').textContent = 'Click again to apply (changes the file)';
  armTimer = setTimeout(function () { armed = null; $('apply').textContent = 'Apply'; }, 5000);
};
$('cancel').onclick = function () { parent.postMessage({ pluginMessage: { type: 'cancel' } }, '*'); };
function download(name, text) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
$('dl').onclick = function () { if (lastJson) download(lastName, lastJson); };
$('cp').onclick = function () {
  var t = document.createElement('textarea'); t.value = lastJson; document.body.appendChild(t); t.select();
  var ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  document.body.removeChild(t);
  if (!ok && navigator.clipboard) navigator.clipboard.writeText(lastJson);
  log(ok ? 'Copied.' : 'Copy may have been blocked; use Download.');
};
function table(obj) {
  var h = '<table>';
  Object.keys(obj).forEach(function (k) { h += '<tr><th>' + k + '</th><td>' + obj[k] + '</td></tr>'; });
  return h + '</table>';
}
function showResult(r) {
  lastJson = r.json || '';
  var stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
  if (r.error) { $('sum').textContent = 'Error: ' + r.error; return; }
  if (r.action === 'inventory') {
    lastName = 'ds-inventory.json';
    $('sum').innerHTML = '<b>Inventory exported' + (r.cancelled ? ' (cancelled, partial)' : '') + '</b>' + table(r.inventoryCounts) + (r.failures ? '<div class="s-failed">' + r.failures + ' item(s) failed: ' + (r.failureList || []).join(' | ') + '</div>' : '') +
      '<div class="hint">Save as ds-inventory.json next to tokens.mjs and pass it with --inventory.</div>';
  } else {
    lastName = r.action === 'dry' ? 'figma-lift-dry-run-' + stamp + '.json' : 'figma-lift-apply-' + stamp + '.json';
    var c = r.counts || {};
    $('sum').innerHTML = '<b>' + (r.action === 'dry' ? 'Dry run (nothing changed)' : 'Apply') + (r.cancelled ? ' CANCELLED, partial' : ' finished') + '</b>' + table(c) +
      (r.conflicts ? '<div class="s-conflict">' + r.conflicts + ' conflict(s): the file value was kept, see the list.</div>' : '') + (r.failures ? '<div class="s-failed">' + r.failures + ' failure(s).</div>' : '');
    try {
      var items = JSON.parse(r.json).items;
      var order = { failed: 0, conflict: 1, review: 2, 'would create': 3, created: 3, exists: 4, skipped: 5 };
      items.sort(function (a, b) { return (order[a.status] || 9) - (order[b.status] || 9); });
      var box = $('list'); var frag = document.createDocumentFragment();
      items.slice(0, 1500).forEach(function (it) {
        var d = document.createElement('div'); d.className = 'row';
        d.innerHTML = '<span class="s s-' + it.status.split(' ')[0] + '"></span><span class="n"></span>';
        d.firstChild.textContent = it.status; d.lastChild.textContent = it.family + ' ' + (it.name || it.key) + (it.detail ? ': ' + it.detail : '');
        frag.appendChild(d);
      });
      box.appendChild(frag);
      if (items.length > 1500) log('List shows the first 1500 of ' + items.length + '; the JSON has all.');
    } catch (e) { log('Could not render list: ' + e.message); }
  }
  $('dl').disabled = !lastJson; $('cp').disabled = !lastJson;
}
onmessage = function (e) {
  var m = e.data.pluginMessage; if (!m) return;
  if (m.log) log(m.log);
  if (m.progress) { $('bar').max = m.progress.total || 1; $('bar').value = m.progress.total ? m.progress.done : 0; $('prog').textContent = m.progress.done + (m.progress.total ? ' / ' + m.progress.total : ' items'); }
  if (m.result) showResult(m.result);
  if (m.finished) busy(false);
};
</script>
